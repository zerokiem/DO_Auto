# DOffice Auto - Project cho Container Manager (DSM 7.2) tren DS423.
#
# TRUOC KHI DUNG, sua lai 2 duong dan mount ben duoi cho khop may ban:
#   - Dong "code":     /volume1/homes/binhnx/Working/Programming/DO_Auto  (noi ban dat code)
#   - Dong "du lieu":  /volume1/homes/binhnx/Working/Van_ban             (noi luu PDF/Excel/log)
services:
  doffice:
    build: .
    image: doffice-auto:latest
    container_name: doffice
    restart: unless-stopped
    ports:
      - "8877:8877"
    environment:
      - DOFFICE_DATA_DIR=/data
      # Duong dan hien thi trong Excel/web de bam mo file tren may Windows. Tren
      # cac may cua ban, thu muc du lieu NAS (/volume1/homes/binhnx/Working/Van_ban)
      # duoc map vao o S: -> S:\Working\Van_ban. Sua lai neu may ban map o dia khac.
      - 'DOFFICE_DISPLAY_DIR=S:\Working\Van_ban'
      # Hyperlink ten file trong Excel tro toi NAS qua web (dia chi Tailscale co
      # dinh) de bam mo duoc tren dien thoai co Tailscale. Doi IP/cong neu khac.
      - 'DOFFICE_DISPLAY_URL=http://100.100.1.254:8877/vb'
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      # Code (chua config.py, do_auto/, webapp/, playwright/.auth/state.json ...)
      - /volume1/homes/binhnx/Working/Programming/DO_Auto:/app
      # Thu muc luu ket qua: PDF, Tong_hop_DOffice.xlsx, logs, history.sqlite3
      - /volume1/homes/binhnx/Working/Van_ban:/data
    # /dev/shm nho trong container; da bat --disable-dev-shm-usage cho Chromium
    # nen 256m la du. Tang len neu gap loi tab crash.
    shm_size: "256mb"
