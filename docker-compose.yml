# DOffice Auto - chay tren BAT KY may nao co Docker: NAS Synology, Raspberry Pi,
# WSL2, Docker Desktop (Windows/Mac), may chu Linux...
#
# CAI DAT 1 LENH:
#   git clone https://github.com/zerokiem/DO_Auto.git
#   cd DO_Auto
#   cp .env.example .env      # sua neu can (xem chu thich trong .env.example)
#   docker compose up -d      # tren NAS Synology: sudo docker-compose up -d
#
# Cac gia tri RIENG cho tung may (duong dan du lieu, o dia hien thi, IP...) doc
# tu file .env cung thu muc. KHONG sua truc tiep file nay -> lan `git pull` sau
# khong bi xung dot/mat cau hinh rieng.
services:
  doffice:
    build: .
    image: doffice-auto:latest
    container_name: doffice
    restart: unless-stopped
    ports:
      - "${DOFFICE_PORT:-8877}:8877"
    environment:
      # Trong container, du lieu luon o /data (khong doi). Doi cho luu THAT tren
      # may chu bang DOFFICE_DATA_HOST trong .env, khong phai bien nay.
      - DOFFICE_DATA_DIR=/data
      # (Tuy chon) URL public de hyperlink PDF mo qua web/Tailscale.
      - DOFFICE_DISPLAY_URL=${DOFFICE_DISPLAY_URL:-}
      - DOFFICE_TELEGRAM_ENABLED=${DOFFICE_TELEGRAM_ENABLED:-false}
      - DOFFICE_TELEGRAM_BOT_TOKEN=${DOFFICE_TELEGRAM_BOT_TOKEN:-}
      - DOFFICE_TELEGRAM_CHAT_ID=${DOFFICE_TELEGRAM_CHAT_ID:-}
      - DOFFICE_TELEGRAM_ONLY_IF_NEW=${DOFFICE_TELEGRAM_ONLY_IF_NEW:-true}
      - TZ=${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      # Code = chinh thu muc repo nay (chua config.py, do_auto/, webapp/, va
      # playwright/.auth/state.json sau khi dang nhap). Sua code xong chi can
      # `restart`, khong build lai image.
      - .:/app
      # Du lieu: PDF, Tong_hop_DOffice.xlsx, logs, history.sqlite3. Mac dinh
      # ./data ngay trong repo (tu tao khi chay lan dau). Doi qua DOFFICE_DATA_HOST
      # trong .env de luu cho khac (vd tren NAS: /volume1/homes/<ban>/.../Van_ban).
      - ${DOFFICE_DATA_HOST:-./data}:/data
    # /dev/shm nho trong container; da bat --disable-dev-shm-usage cho Chromium
    # nen 256m la du. Tang len (vd "512mb") neu gap loi tab Chromium crash.
    shm_size: "256mb"
